name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flet flet-audio
      - run: flet build apk --yes
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
